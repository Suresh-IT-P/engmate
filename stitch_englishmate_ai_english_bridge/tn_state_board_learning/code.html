<script>
  function toggleUnit(id) {
    const el = document.getElementById(id);
    const isExpanded = el.style.height === 'auto' || el.classList.contains('shadow-md');
    
    // Close all (simple simulation)
    document.querySelectorAll('[id^="unit-"]').forEach(unit => {
      unit.style.height = '88px';

      const title = unit.querySelector('h3');
      title.classList.remove('text-on-surface');
      title.classList.add('text-on-surface-variant');
      const topics = unit.querySelector('.opacity-0, .opacity-100');
      if(topics) {
          topics.classList.remove('opacity-100', 'pointer-events-auto');
          topics.classList.add('opacity-0', 'pointer-events-none');
      }
    });

    if (!isExpanded) {
      el.style.height = 'auto';
      el.classList.remove('shadow-sm');
      el.classList.add('shadow-md');
      const title = el.querySelector('h3');
      title.classList.remove('text-on-surface-variant');
      title.classList.add('text-on-surface');
      const topics = el.querySelector('.opacity-0, .opacity-100');
      if(topics) {
          topics.classList.remove('opacity-0', 'pointer-events-none');
          topics.classList.add('opacity-100', 'pointer-events-auto');
      }
    }
  }
