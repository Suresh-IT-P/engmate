<script>
    // Simple particle effect for extra delight on load
    document.addEventListener('DOMContentLoaded', () => {
        const container = document.querySelector('.flex-col');
        if(!container) return;
        
        for(let i=0; i<15; i++) {
            const particle = document.createElement('div');
            particle.style.position = 'absolute';
            particle.style.width = Math.random() * 8 + 4 + 'px';
            particle.style.height = particle.style.width;
            particle.style.background = ['#4f46e5', '#6cf8bb', '#ffb95f'][Math.floor(Math.random() * 3)];
            particle.style.borderRadius = '50%';
            particle.style.top = '20%';
            particle.style.left = '50%';
            particle.style.transform = 'translate(-50%, -50%)';
            particle.style.pointerEvents = 'none';
            particle.style.zIndex = '1';
            
            const tx = (Math.random() - 0.5) * 300;
            const ty = (Math.random() - 0.5) * 300 - 100;
            
            particle.animate([
                { transform: 'translate(-50%, -50%) scale(1)', opacity: 1 },
                { transform: `translate(calc(-50% + ${tx}px), calc(-50% + ${ty}px)) scale(0)`, opacity: 0 }
            ], {
                duration: 1000 + Math.random() * 1000,
                easing: 'cubic-bezier(0, .9, .57, 1)',
                fill: 'forwards'
            });
            
            container.appendChild(particle);
        }
    });
