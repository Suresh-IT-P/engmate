<script>
  // Simple CSS particle animation for confetti
  const container = document.getElementById('confetti-container');
  const colors = ['#4f46e5', '#6ffbbe', '#ffb95f', '#ba1a1a'];
  
  for(let i=0; i<30; i++) {
    const confetti = document.createElement('div');
    confetti.className = 'absolute rounded-sm opacity-80';
    confetti.style.width = Math.random() * 8 + 4 + 'px';
    confetti.style.height = Math.random() * 16 + 8 + 'px';
    confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
    confetti.style.left = Math.random() * 100 + 'vw';
    confetti.style.top = -20 + 'px';
    
    // Randomize fall
    const duration = Math.random() * 3 + 2;
    const delay = Math.random() * 2;
    
    confetti.animate([
      { transform: `translate3d(0,0,0) rotate(0deg)`, opacity: 1 },
      { transform: `translate3d(${Math.random()*100-50}px, 100vh, 0) rotate(${Math.random()*360}deg)`, opacity: 0 }
    ], {
      duration: duration * 1000,
      delay: delay * 1000,
      iterations: Infinity,
      easing: 'cubic-bezier(.37,0,.63,1)'
    });
    
    container.appendChild(confetti);
  }
