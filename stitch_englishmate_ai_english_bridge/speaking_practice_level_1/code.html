<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700&family=Be+Vietnam+Pro:wght@400;500&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@100..900&family=Plus+Jakarta+Sans:wght@100..900&display=swap" rel="stylesheet"/><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "tertiary-container": "#885500", "surface-tint": "#4d44e3", "surface-variant": "#e4e1ee", "surface-container-high": "#eae6f4", "surface-container-lowest": "#ffffff", "surface": "#fcf8ff", "primary-fixed-dim": "#c3c0ff", "outline-variant": "#c7c4d8", "inverse-on-surface": "#f3effc", "on-error": "#ffffff", "secondary-fixed": "#6ffbbe", "surface-bright": "#fcf8ff", "on-secondary": "#ffffff", "on-tertiary": "#ffffff", "surface-dim": "#dcd8e5", "error-container": "#ffdad6", "on-primary-container": "#dad7ff", "inverse-primary": "#c3c0ff", "on-secondary-container": "#00714d", "surface-container-low": "#f5f2ff", "surface-container": "#f0ecf9", "on-tertiary-container": "#ffd4a4", "on-tertiary-fixed": "#2a1700", "surface-container-highest": "#e4e1ee", "on-primary-fixed": "#0f0069", "background": "#fcf8ff", "on-secondary-fixed-variant": "#005236", "secondary-container": "#6cf8bb", "on-surface-variant": "#464555", "on-tertiary-fixed-variant": "#653e00", "secondary": "#006c49", "tertiary-fixed": "#ffddb8", "primary": "#3525cd", "on-secondary-fixed": "#002113", "on-primary": "#ffffff", "on-surface": "#1b1b24", "on-primary-fixed-variant": "#3323cc", "primary-fixed": "#e2dfff", "secondary-fixed-dim": "#4edea3", "inverse-surface": "#302f39", "tertiary-fixed-dim": "#ffb95f", "primary-container": "#4f46e5", "on-background": "#1b1b24", "tertiary": "#684000", "error": "#ba1a1a", "on-error-container": "#93000a", "outline": "#777587" }, "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, "spacing": { "md": "24px", "base": "8px", "lg": "40px", "max-width": "1200px", "xs": "4px", "sm": "12px", "xl": "64px", "margin-mobile": "20px", "gutter": "16px" }, "fontFamily": { "display-lg": ["Plus Jakarta Sans"], "display-lg-mobile": ["Plus Jakarta Sans"], "tamil-subtext": ["Be Vietnam Pro"], "body-md": ["Be Vietnam Pro"], "headline-md": ["Plus Jakarta Sans"], "body-lg": ["Be Vietnam Pro"], "label-caps": ["Plus Jakarta Sans"] }, "fontSize": { "display-lg": ["40px", { "lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "700" }], "display-lg-mobile": ["32px", { "lineHeight": "1.2", "fontWeight": "700" }], "tamil-subtext": ["14px", { "lineHeight": "1.4", "fontWeight": "500" }], "body-md": ["16px", { "lineHeight": "1.5", "fontWeight": "400" }], "headline-md": ["24px", { "lineHeight": "1.3", "fontWeight": "600" }], "body-lg": ["18px", { "lineHeight": "1.6", "fontWeight": "400" }], "label-caps": ["12px", { "lineHeight": "1.0", "letterSpacing": "0.05em", "fontWeight": "700" }] } } } };</script></head><body class="bg-surface text-on-surface font-body-md min-h-screen pt-safe pb-safe"><main class="flex flex-col w-full"><div class="flex flex-col w-full h-full min-h-[100dvh] bg-surface relative overflow-hidden">
<!-- Header / Nav -->
<header class="px-margin-mobile py-sm flex items-center justify-between z-10 relative">
<button aria-label="Go back" class="w-10 h-10 flex items-center justify-center rounded-full bg-surface-container-high text-on-surface hover:bg-surface-container-highest transition-colors active:scale-95">
<span class="material-symbols-outlined text-[24px]">arrow_back</span>
</button>
<div class="flex items-center gap-2 px-3 py-1.5 bg-primary-container text-on-primary-container rounded-full shadow-sm">
<span class="material-symbols-outlined text-[18px]">psychiatry</span>
<span class="font-tamil-subtext text-label-caps">XP 120</span>
</div>
</header>
<!-- Main Content Area -->
<div class="flex-1 flex flex-col items-center justify-between px-margin-mobile pb-xl pt-sm z-10 relative">
<!-- Top Section: Illustration & Prompt -->
<div class="w-full flex flex-col items-center flex-1 max-w-md mx-auto mt-4">
<!-- Illustration -->
<div class="w-48 h-48 mb-6 relative">
<!-- Decorative subtle background blob -->
<div class="absolute inset-0 bg-primary/10 rounded-full blur-2xl animate-pulse" style="animation-duration: 4s;"></div>
<img alt="Student with microphone practicing speaking" class="w-full h-full object-contain relative z-10 drop-shadow-md" src="https://lh3.googleusercontent.com/aida/AEtjO1UwWCtHGiYgCCkSQjzYymhNR46Rphas8rHW-CrW53jiOpN3VfFIG2fb73iOMHChsSJf1jhaswZ6b1Txt87mWjUhCwRVc2gvJQbUUmZ9s3ph2MjaiWegFH7vueYWr0UTrmLLFSOadhTwMiM_tfjQMnKOkrLCtYe66E6WmqmLlTQgtQB-8NMA30riVST8VkYdbtuC-t-80qyl-mRDIUzyhx5vXnwYeNQzbjFjTK8_jhVSwrwCK6U4ypvWCcg"/>
</div>
<!-- Prompt Card -->
<div class="bg-surface-container-lowest w-full rounded-[24px] p-6 shadow-sm shadow-primary/5 flex flex-col items-center text-center gap-4 relative">
<span class="text-label-caps text-primary tracking-wider uppercase">Speak this sentence</span>
<h2 class="font-headline-md text-headline-md text-on-surface leading-tight">
          "I went to school yesterday."
        </h2>
<div class="w-full h-px bg-surface-variant my-2"></div>
<p class="font-tamil-subtext text-body-lg text-on-surface-variant opacity-80">
          நான் நேற்று பள்ளிக்கு சென்றேன்.
        </p>
<!-- Help Button -->
<button class="absolute -bottom-4 right-6 bg-surface-container-high text-primary px-4 py-2 rounded-full font-tamil-subtext text-sm flex items-center gap-2 shadow-sm hover:bg-surface-variant transition-colors active:scale-95" id="help-btn">
<span class="material-symbols-outlined text-[18px]">lightbulb</span>
<span>தமிழ் உதவி</span>
</button>
</div>
<!-- Hidden Tooltip / Help Text -->
<div class="mt-8 bg-inverse-surface text-inverse-on-surface p-4 rounded-xl font-tamil-subtext text-sm opacity-0 translate-y-2 transition-all duration-300 w-full max-w-sm hidden" id="help-tooltip">
<div class="flex items-start gap-3">
<span class="material-symbols-outlined text-secondary-fixed mt-0.5">info</span>
<p><strong>Tip:</strong> 'Yesterday' என்பது கடந்த காலத்தை (past tense) குறிக்கிறது.</p>
</div>
</div>
</div>
<!-- Action Area: Mic Button & Feedback -->
<div class="w-full flex flex-col items-center justify-end mt-8 pb-4">
<!-- Status Text -->
<div class="h-8 flex items-center justify-center mb-6 font-body-md text-on-surface-variant transition-opacity duration-300" id="status-text">
        Tap to start speaking
      </div>
<!-- Mic Button Container -->
<div class="relative flex items-center justify-center">
<!-- Ripple Effects (Hidden by default, shown via JS) -->
<div class="absolute w-24 h-24 bg-primary/20 rounded-full scale-0 opacity-0 transition-all duration-700 pointer-events-none" id="mic-ripple-1"></div>
<div class="absolute w-24 h-24 bg-primary/10 rounded-full scale-0 opacity-0 transition-all duration-1000 delay-150 pointer-events-none" id="mic-ripple-2"></div>
<!-- The Button -->
<button class="relative z-10 w-24 h-24 bg-primary text-on-primary rounded-full shadow-[0_8px_30px_rgba(53,37,205,0.3)] flex items-center justify-center transition-all duration-300 hover:scale-105 active:scale-95 active:shadow-[0_4px_15px_rgba(53,37,205,0.4)]" id="mic-btn">
<span class="material-symbols-outlined text-[40px] transition-transform duration-300" id="mic-icon" style="font-variation-settings: 'FILL' 1;">mic</span>
</button>
</div>
<!-- Waveform (Hidden by default) -->
<div class="flex items-end justify-center h-12 gap-1 mt-6 opacity-0 transition-opacity duration-300" id="waveform">
<div class="w-1.5 bg-primary rounded-t-full h-2 animate-[wave_1s_ease-in-out_infinite]"></div>
<div class="w-1.5 bg-primary rounded-t-full h-4 animate-[wave_1s_ease-in-out_infinite_0.1s]"></div>
<div class="w-1.5 bg-primary rounded-t-full h-8 animate-[wave_1s_ease-in-out_infinite_0.2s]"></div>
<div class="w-1.5 bg-primary rounded-t-full h-5 animate-[wave_1s_ease-in-out_infinite_0.3s]"></div>
<div class="w-1.5 bg-primary rounded-t-full h-3 animate-[wave_1s_ease-in-out_infinite_0.4s]"></div>
</div>
</div>
</div>
<style>
    @keyframes wave {
      0%, 100% { transform: scaleY(1); }
      50% { transform: scaleY(1.8); }
    }
    
    .is-listening #mic-ripple-1 {
      animation: ripple 1.5s infinite cubic-bezier(0.65, 0, 0.34, 1);
    }
    .is-listening #mic-ripple-2 {
      animation: ripple 1.5s infinite cubic-bezier(0.65, 0, 0.34, 1) 0.3s;
    }
    
    @keyframes ripple {
      0% { transform: scale(1); opacity: 1; }
      100% { transform: scale(2.5); opacity: 0; }
    }
  </style>
<script>
    document.addEventListener('DOMContentLoaded', () => {
      const micBtn = document.getElementById('mic-btn');
      const micIcon = document.getElementById('mic-icon');
      const statusText = document.getElementById('status-text');
      const waveform = document.getElementById('waveform');
      const body = document.body;
      
      let isListening = false;

      micBtn.addEventListener('click', () => {
        isListening = !isListening;
        
        if (isListening) {
          // Start listening state
          body.classList.add('is-listening');
          micBtn.classList.replace('bg-primary', 'bg-error');
          micBtn.classList.replace('shadow-[0_8px_30px_rgba(53,37,205,0.3)]', 'shadow-[0_8px_30px_rgba(186,26,26,0.3)]');
          micIcon.textContent = 'stop';
          statusText.innerHTML = '<span class="text-primary font-bold animate-pulse">Listening...</span>';
          waveform.classList.remove('opacity-0');
          waveform.classList.add('opacity-100');
          
          // Simulated success after a few seconds for demo purposes
          setTimeout(() => {
             if(isListening) {
                 stopListening(true);
             }
          }, 3000);
          
        } else {
          // Stop listening manually
          stopListening(false);
        }
      });
      
      function stopListening(success) {
          isListening = false;
          body.classList.remove('is-listening');
          micBtn.classList.replace('bg-error', 'bg-primary');
          micBtn.classList.replace('shadow-[0_8px_30px_rgba(186,26,26,0.3)]', 'shadow-[0_8px_30px_rgba(53,37,205,0.3)]');
          micIcon.textContent = 'mic';
          waveform.classList.add('opacity-0');
          waveform.classList.remove('opacity-100');
          
          if(success) {
             statusText.innerHTML = '<span class="text-secondary font-bold flex items-center gap-1"><span class="material-symbols-outlined text-[20px]">check_circle</span> Excellent!</span>';
             
             // Quick success animation on button
             micBtn.classList.add('bg-secondary', 'text-on-secondary');
             setTimeout(() => {
                 micBtn.classList.remove('bg-secondary', 'text-on-secondary');
             }, 1000);
          } else {
              statusText.innerHTML = 'Tap to start speaking';
          }
      }

      // Help Toggle
      const helpBtn = document.getElementById('help-btn');
      const helpTooltip = document.getElementById('help-tooltip');
      let helpVisible = false;

      helpBtn.addEventListener('click', () => {
        helpVisible = !helpVisible;
        if (helpVisible) {
          helpTooltip.classList.remove('hidden');
          // small delay to allow display:block to apply before animating opacity
          setTimeout(() => {
            helpTooltip.classList.remove('opacity-0', 'translate-y-2');
          }, 10);
        } else {
          helpTooltip.classList.add('opacity-0', 'translate-y-2');
          setTimeout(() => {
            helpTooltip.classList.add('hidden');
          }, 300); // match transition duration
        }
      });
    });
  </script>
</div></main></body></html>
