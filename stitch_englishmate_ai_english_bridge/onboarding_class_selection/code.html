<style>
  @keyframes fade-in-up {
    from {
      opacity: 0;
      transform: translateY(20px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }
  .animate-fade-in-up {
    animation: fade-in-up 0.6s ease-out forwards;
  }
  
  .class-card {
      opacity: 0;
      animation: fade-in-up 0.5s ease-out forwards;
  }
  
  .class-card:nth-child(1) { animation-delay: 0.1s; }
  .class-card:nth-child(2) { animation-delay: 0.15s; }
  .class-card:nth-child(3) { animation-delay: 0.2s; }
  .class-card:nth-child(4) { animation-delay: 0.25s; }
  .class-card:nth-child(5) { animation-delay: 0.3s; }

</style>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const cards = document.querySelectorAll('.class-card');
    const continueContainer = document.getElementById('continue-container');
    let selectedClass = null;

    cards.forEach(card => {
      card.addEventListener('click', () => {
        // Remove selection from all
        cards.forEach(c => {
          c.classList.remove('ring-4', 'ring-primary', 'bg-primary/5', 'shadow-inner');
          c.querySelector('.ring-2')?.classList.remove('opacity-100');
        });

        // Add selection to clicked
        card.classList.add('ring-4', 'ring-primary', 'bg-primary/5', 'shadow-inner');
        
        // Show continue button
        if (!selectedClass) {
          continueContainer.classList.remove('opacity-0', 'translate-y-4');
          continueContainer.classList.add('opacity-100', 'translate-y-0');
        }
        
        // Play subtle sound/haptic here if in native wrapper
        selectedClass = card;
      });
    });
  });
