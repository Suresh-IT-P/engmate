<style>
    .hide-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .hide-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    
    /* Dynamic states added via JS */
    .answer-correct {
      background-color: #006c49 !important; /* secondary */
      color: #ffffff !important;
      transform: scale(1.02);
      box-shadow: 0 4px 12px rgba(0, 108, 73, 0.2);
    }
    .answer-correct span {
       color: #ffffff !important;
    }
    
    .answer-wrong {
      background-color: #ba1a1a !important; /* error */
      color: #ffffff !important;
      opacity: 0.8;
    }
    .answer-wrong span {
       color: #ffffff !important;
    }
    
    .answer-disabled {
      opacity: 0.5;
      pointer-events: none;
    }
  </style>
<script>
    let timer = 12;
    const timerElement = document.getElementById('countdown-timer');
    let interval = setInterval(() => {
      timer--;
      if(timer >= 0) {
        timerElement.innerText = timer;
      } else {
        clearInterval(interval);
        // Handle timeout
      }
    }, 1000);

    function handleAnswer(button, isCorrect) {
      clearInterval(interval);
      const buttons = document.querySelectorAll('.answer-btn');
      
      // Disable all buttons
      buttons.forEach(btn => {
        btn.classList.add('answer-disabled');
        if(btn !== button) {
          // Find the correct one to highlight if wrong was picked
          if(btn.querySelector('span:last-child').innerText === 'goes') {
            btn.classList.add('answer-correct');
            btn.classList.remove('answer-disabled');
          }
        }
      });

      // Style clicked button
      button.classList.remove('answer-disabled');
      if(isCorrect) {
        button.classList.add('answer-correct');
        showFeedback(true);
      } else {
        button.classList.add('answer-wrong');
        showFeedback(false);
      }
    }

    function showFeedback(isCorrect) {
      const toast = document.getElementById('feedback-toast');
      const iconContainer = document.getElementById('feedback-icon');
      const icon = iconContainer.querySelector('span');
      const title = document.getElementById('feedback-title');

      if (isCorrect) {
        iconContainer.className = 'w-8 h-8 rounded-full flex items-center justify-center flex-shrink-0 mt-xs bg-secondary';
        icon.innerText = 'check';
        title.innerText = 'Excellent!';
        title.className = 'font-headline-md text-body-lg mb-xs text-secondary-fixed';
      } else {
        iconContainer.className = 'w-8 h-8 rounded-full flex items-center justify-center flex-shrink-0 mt-xs bg-error';
        icon.innerText = 'close';
        title.innerText = 'Not quite!';
        title.className = 'font-headline-md text-body-lg mb-xs text-error-container';
      }

      // Show toast
      toast.classList.remove('translate-y-full', 'opacity-0');
      
      // Add a slight bounce
      setTimeout(() => {
        toast.classList.add('-translate-y-2');
        setTimeout(() => toast.classList.remove('-translate-y-2'), 150);
      }, 300);
    }
  </script>
