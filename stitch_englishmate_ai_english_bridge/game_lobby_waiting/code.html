<script>
    function toggleReadyState(btn) {
        const isReady = btn.classList.contains('bg-secondary');
        
        if (isReady) {
            // Revert to Not Ready
            btn.classList.remove('bg-secondary', 'text-on-secondary', 'shadow-[0_4px_0_rgba(0,108,73,0.3)]', 'active:shadow-[0_0px_0_rgba(0,108,73,0.3)]');
            btn.classList.add('bg-surface-variant', 'text-on-surface-variant', 'shadow-[0_4px_0_rgba(119,117,135,0.2)]', 'active:shadow-[0_0px_0_rgba(119,117,135,0.2)]');
            btn.querySelector('span:nth-child(2)').textContent = 'NOT READY';
            btn.querySelector('span:nth-child(3)').textContent = 'இன்னும் தயாராகவில்லை';
        } else {
            // Set to Ready
            btn.classList.remove('bg-surface-variant', 'text-on-surface-variant', 'shadow-[0_4px_0_rgba(119,117,135,0.2)]', 'active:shadow-[0_0px_0_rgba(119,117,135,0.2)]');
            btn.classList.add('bg-secondary', 'text-on-secondary', 'shadow-[0_4px_0_rgba(0,108,73,0.3)]', 'active:shadow-[0_0px_0_rgba(0,108,73,0.3)]');
            btn.querySelector('span:nth-child(2)').textContent = 'READY!';
            btn.querySelector('span:nth-child(3)').textContent = 'தயார்';
            
            // Add a little celebration sparkle
            createSparkles(btn);
        }
    }

    function createSparkles(container) {
        for(let i=0; i<5; i++) {
            const sparkle = document.createElement('div');
            sparkle.className = 'absolute w-2 h-2 bg-white rounded-full opacity-0 pointer-events-none z-20';
            sparkle.style.left = Math.random() * 100 + '%';
            sparkle.style.top = Math.random() * 100 + '%';
            container.appendChild(sparkle);
            
            sparkle.animate([
                { transform: 'scale(0) translateY(0)', opacity: 1 },
                { transform: `scale(1.5) translateY(-20px)`, opacity: 0 }
            ], {
                duration: 600 + Math.random() * 400,
                easing: 'cubic-bezier(0.2, 0.8, 0.2, 1)',
                fill: 'forwards'
            });
            
            setTimeout(() => sparkle.remove(), 1000);
        }
    }
